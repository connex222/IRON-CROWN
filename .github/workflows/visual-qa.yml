name: Iron Crown visual QA
on:
  push:
    branches: [main]
    paths:
      - public/tv.html
      - public/phone.html
      - package.json
      - tools/qa_ui_browser.js
      - .github/workflows/visual-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime and Chromium
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real browser QA
        run: node tools/qa_ui_browser.js
      - name: Store browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iron-crown-visual-qa-screenshots
          path: qa-output/
          retention-days: 14
