name: Assemble uploaded IRON CROWN music
on:
  push:
    branches: [staging/iron-crown-audio-transfer-20261024]
    paths: [.github/workflows/assemble-user-track.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify supplied original music
        run: |
          set -euo pipefail
          test "$(find .track-import -maxdepth 1 -name 'chunk*.b64' | wc -l)" -eq 80
          cat .track-import/chunk*.b64 | base64 -d > public/audio/music-five-lost-crowns.mp3
          echo '137be7367127fc94615486c04c856067daed60f3c66d0be609e87c3f752626f2  public/audio/music-five-lost-crowns.mp3' | sha256sum -c
          test "$(wc -c < public/audio/music-five-lost-crowns.mp3)" -eq 3800963
      - name: Install ffmpeg and check the entire musical recording
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -v error -show_entries format=duration,bit_rate -of json public/audio/music-five-lost-crowns.mp3
          ffmpeg -v error -nostdin -i public/audio/music-five-lost-crowns.mp3 -f null -
      - name: Commit verified MP3 to temporary branch without transfer text
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/audio/music-five-lost-crowns.mp3
          git rm -r .track-import
          git commit -m 'Verify and assemble provided The Five Lost Crowns background music'
          git push origin HEAD:staging/iron-crown-audio-transfer-20261024
