name: Iron Crown production checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install game server runtime
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax verification
        run: |
          node --check src/server.js
          node --check src/game.js
          node --check src/audio.js
      - name: Entire game and soundtrack regression suite
        run: npm test
