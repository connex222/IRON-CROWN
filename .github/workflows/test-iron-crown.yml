name: Iron Crown v2 tests and audio integrity
on:
  push:
    branches: [main, staging/iron-crown-stage10-audio, staging/iron-crown-stage11-balance, staging/iron-crown-stage12-resilience]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install game runtime
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify v2 source syntax
        run: |
          node --check src/server.js
          node --check src/game.js
          node --check src/audio.js
      - name: Run the full Node and real WebSocket regression suite
        run: npm test
      - name: Verify installed Stage 10 audio and eight approved portraits
        if: github.ref == 'refs/heads/staging/iron-crown-stage10-audio' || (github.ref == 'refs/heads/staging/iron-crown-stage11-balance' || github.ref == 'refs/heads/staging/iron-crown-stage12-resilience')
        run: |
          set -euo pipefail
          sha256sum --check docs/STAGE10-BESPOKE-SHA256.txt
          sha256sum --check docs/AUDIO-STAGING-MASTER-SHA256.txt
          node -e "const {CUES,EXTRA_CUES,availableAudio}=require('./src/audio');const a=availableAudio('public/audio');if(CUES.length!==17||EXTRA_CUES.length!==9||a.length!==26)process.exit(1);console.log('26 of 26 original plus bespoke recordings verified')"
          test "$(find public/art/avatars -maxdepth 1 -name '*_human.png' | wc -l)" -eq 8
          test "$(find public/art/avatars -maxdepth 1 -name '*.png' | wc -l)" -eq 8
      - name: Validate both independent 2,000-game Quick four-player samples
        if: github.ref == 'refs/heads/staging/iron-crown-stage11-balance' || github.ref == 'refs/heads/staging/iron-crown-stage12-resilience'
        run: |
          REQUIRE_BALANCE_PASS=1 node tools/evaluate_balance.js docs/stage11-run/quick4-2000-margin9.json docs/stage11-run/quick4-2000-independent.json
          echo 'Historical Stage 8 failure remains archived; current Stage 11 criteria passed.'
      - name: Validate two independent 2,000-game Quick eight-player samples
        if: github.ref == 'refs/heads/staging/iron-crown-stage12-resilience'
        run: |
          REQUIRE_BALANCE_PASS=1 node tools/evaluate_balance.js docs/stage12-run/quick8-2000-seed20261212.json docs/stage12-run/quick8-2000-seed20261214.json
          echo 'Stage 12 Quick eight-player acceptance: four out of four formal gates passed.'
