.minimap{background:radial-gradient(circle at center,#9ead8d,#466959);border:2px solid var(--brass);box-shadow:inset 0 0 28px #1b3c3877}

/* PHASE 3 — Premium private controller and cinematic human characters */
.phone-logo{width:163px;max-height:52px;object-fit:contain;display:block}header{background:linear-gradient(120deg,#091918,#251c17);box-shadow:0 5px 20px #0004}.status{letter-spacing:.13em;font-size:11px}
body{background-image:radial-gradient(circle at 70% -5%,#d1aa4830,transparent 35%)}

.phone-join-scene img{width:min(100%,410px);max-height:180px;object-fit:contain;filter:drop-shadow(0 8px 9px #000a)}.phone-join-scene .eyebrow{color:#e6c46d}.phone-join-scene p{letter-spacing:.15em;font-size:12px;font-weight:800}.join-form{border:2px solid #b78e3a;box-shadow:0 8px 24px #0002}

.tycoon-intro h1{font-size:36px;color:#f5d98b}.tycoon-intro .eyebrow{color:#e7c56e}.tycoon-intro p{line-height:1.55;color:#ecdbb9;margin-bottom:0}
.avatar-gallery{gap:13px}.avatar-choice{position:relative;display:flex;align-items:center;flex-direction:column;overflow:hidden;border-radius:11px;border:2px solid var(--actor);padding:0 0 12px;background:linear-gradient(150deg,#25332f,#131e20);color:#fff0ce;box-shadow:0 9px 20px #0004;min-height:335px;text-align:center;transition:transform .2s,border-color .2s}.avatar-choice:focus-visible{outline:4px solid #f7dc91;outline-offset:3px}.avatar-choice:hover:not(:disabled){transform:translateY(-3px);border-color:#f4cc73}.avatar-choice img{width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;border:0;border-bottom:3px solid var(--actor);border-radius:0;margin:0 0 9px}.actor-title{font-size:10px;letter-spacing:.12em;font-weight:800;color:#efc96d;text-transform:uppercase}.actor-name{font:700 17px/1.14 Georgia,serif;padding:4px 8px;min-height:42px}.actor-quote{font:italic 12px Georgia,serif;color:#e7d9bc;padding:0 7px;min-height:29px}.actor-perk{font-size:11px;line-height:1.3;opacity:.92;padding:5px 9px;min-height:38px}.actor-choose{font-size:11px;letter-spacing:.06em;font-weight:900;color:#ffe6a0;padding-top:8px;border-top:1px solid #cca45455;width:90%}.actor-taken{position:absolute;top:8px;right:6px;padding:5px 7px;background:#371713;color:#fff6dd;border:1px solid #e6b86b;font-size:11px;transform:rotate(4deg)}.avatar-choice:disabled{opacity:.44;filter:grayscale(.4)}
.player-showcase{text-align:center;background:radial-gradient(circle at center 27%,#555244,#1b2b29 60%,#151c1b);border:2px solid var(--actor);color:#f7e6c7}.player-showcase .eyebrow{color:#f4ca70}.player-showcase .hero-actor{display:block;width:min(100%,278px);aspect-ratio:1/1;object-fit:cover;margin:7px auto 18px;border:3px solid #d6ad57;border-radius:12px;box-shadow:0 12px 26px #0008}.player-showcase h1{color:#ffe0a2;margin-bottom:5px}.player-showcase p{line-height:1.5}.actor-role{font-size:14px;letter-spacing:.17em;color:#f0cd77;text-transform:uppercase}.perk-box{text-align:left;display:grid;gap:5px;margin:20px 0;padding:13px;background:#d6b15b17;border:1px solid #ad8b53;border-radius:8px}.perk-box b{font-size:11px;letter-spacing:.09em;color:#edcf85}.perk-box span{font-size:14px}.gathering img{width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid #b38e45}.gathering span:nth-child(2){font-weight:700}
/* Preserve full-size 16px interface text while keeping character metadata compact. */
@media(max-width:360px){.avatar-choice{min-height:305px}.actor-name{font-size:15px}.actor-quote,.actor-perk{font-size:11px}.avatar-gallery{gap:7px}}
@media(prefers-reduced-motion:reduce){.avatar-choice{transition:none}}

.identity-strip{display:flex;align-items:center;gap:13px;background:linear-gradient(105deg,#112623,#302820);border:1px solid #c29c5e;border-radius:12px;padding:8px 11px;color:#f4e0bc;margin-bottom:12px;box-shadow:0 5px 14px #0002}.identity-strip img{width:54px;height:54px;object-fit:cover;border:2px solid #d7ae65;border-radius:7px}.identity-strip div{flex:1;min-width:0}.identity-strip div span{display:block;color:#e6c17a;font-weight:800;letter-spacing:.09em;font-size:10px}.identity-strip strong{display:block;font:700 18px Georgia,serif}.identity-strip>b{font-size:23px;color:#f5d783}
.trade-character{display:flex;align-items:center;gap:12px}.trade-character img{width:88px;height:88px;object-fit:cover;border:2px solid #e1bb77;border-radius:8px;flex-shrink:0}.trade-character h1{font-size:25px}.trade-character h2{font-size:17px}
.watch-avatar{width:150px;height:150px;object-fit:cover;border-radius:10px}.watch-mood{color:var(--brass);font-size:13px;font-weight:900;letter-spacing:.06em;padding:5px 0 10px}
</style></head><body>
<header><div><div><img src="/art/iron-crown-premium.png" class="phone-logo" alt="Iron Crown"></div><div class="status" id="status">PRIVATE CONTROLLER</div></div><button id="rules" class="btn alt tiny" style="width:auto;color:#f4e7cb">Rules</button></header>
<div id="connection" class="banner hidden">Reconnecting… Your seat is safe.</div><main class="wrap" id="app"></main><div id="toast" class="toast hidden"></div><div id="rulesOverlay" class="rule-overlay hidden"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ids=['augusta','silas','jack','ada','rupert','nell','ottoline','ezra'],people=[['augusta','Lady Augusta','The Duchess','#B3261E'],['silas','Silas Brunel-Crane','The Engineer','#1F4FA8'],['jack','Lucky Jack','The Gambler','#1E7A46'],['ada','Mrs Ada Pennyworth','The Banker','#C99A2E'],['rupert','Colonel Fairfax','The Colonel','#22305A'],['nell','Nell Thackery','The Union Boss','#C2571A'],['ottoline','Prof. Ottoline Vex','The Inventor','#6B3FA0'],['ezra','Mr Ezra Coldwell','The Smuggler','#167B7B']];
const bios={augusta:['A noble eye for power','Cities cost 1 less Grain'],silas:['The genius behind the rails','Track costs 1 less Steel per route'],jack:['Fortune favours the daring','Reroll your die once per clash'],ada:['Every empire needs a ledger','Bank trades 2:1 for a chosen resource'],rupert:['Discipline conquers all','Recruit costs 1 Gold per Soldier'],nell:['The people move the country','Immune to Coal Strike and Harsh Winter'],ottoline:['Tomorrow belongs to invention','Research costs 1 less Gold; extra draft choice'],ezra:['Every border has a price','One favourable 2:1 trade per round is compulsory']};
const resourceIcons={coal:'⚒',timber:'♠',grain:'❀',steel:'⚙',gold:'◉'},actionNames={build:'Build Depot',city:'Upgrade City',track:'Lay Track',recruit:'Recruit',trade:'Trade',research:'Research',attack:'Attack',skip:'Pass'},actionIcons={build:'⌂',city:'♜',track:'🚂',recruit:'⚔',trade:'⇄',research:'⚙',attack:'♞',skip:'·'},typeNames={coal:'Coalfield',forest:'Forest',farm:'Farmland',steel:'Steelworks',town:'Market Town',hill:'Hills',lake:'Lake',capital:'Capital'};
const saved=()=>{try{return JSON.parse(localStorage.getItem('ironPhone')||'null');}catch{return null;}};
let ws,room=new URLSearchParams(location.search).get('room')?.toUpperCase()||saved()?.room||'',pid=null,token=null,publicS=null,privateS=null,view='join',actionSlot=0,editor=null,editType='',lastRenderKey='',seenSeq=0,toastTimer=null,spectateTickets=false,manualName='',requestedJoin=false,activeTab='plan',telegraphMode=false;
let tutorial=localStorage.getItem('ironTutorialDone')!=='true',tutorialDismissed=false;
const current=()=>publicS?.players.find(p=>p.id===pid),avatar=(id,mood='neutral')=>`/art/avatars/${id||'augusta'}_${publicS?.era||'steam'}_${mood}.png`;
function send(kind,data={}){if(!ws||ws.readyState!==1){notify('Disconnected. Trying to reconnect.');return;}ws.send(JSON.stringify({type:'action',kind,...data}));}
function notify(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3400);}
function connect(){const old=saved();if(old&&(!room||room===old.room)){room=old.room;pid=old.playerId;token=old.token;}
 ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/socket`);
 ws.onopen=()=>{$('connection').classList.add('hidden');if(pid&&token)ws.send(JSON.stringify({type:'join',code:room,playerId:pid,token}));else if(requestedJoin&&manualName)ws.send(JSON.stringify({type:'join',code:room,name:manualName}));};
 ws.onmessage=e=>{try{const m=JSON.parse(e.data);
  if(m.type==='welcome'){room=m.code;pid=m.playerId;token=m.token;localStorage.setItem('ironPhone',JSON.stringify({room,playerId:pid,token}));$('connection').classList.add('hidden');}
  if(m.type==='state'){const prior=publicS?.status;publicS=m.public;privateS=m.private||null;const newFx=publicS.feed.filter(x=>x.seq>seenSeq);if(newFx.some(x=>x.kind==='clash'&&x.message.includes(current()?.name||'∅'))||m.public.offer?.to===pid)navigator.vibrate?.([90,60,90]);seenSeq=publicS.seq;
   const key=JSON.stringify({phase:publicS.status,round:publicS.round,seq:publicS.seq,me:pid,actions:privateS?.actions,locked:privateS?.locked,upgrades:privateS?.upgrades,choices:privateS?.ticketChoices,offer:privateS?.offer,avatars:publicS.players.map(p=>p.avatar),resources:privateS?.resources,turn:publicS.placementTurn});
   if(key!==lastRenderKey){lastRenderKey=key;render();}
   if(tutorial&&publicS.round>=2&&publicS.status!=='lobby'){tutorial=false;localStorage.setItem('ironTutorialDone','true');}
  }
  if(m.type==='error'){notify(m.message);if(m.message.includes('Room not found')||m.message.includes('Rejoin from your original')){localStorage.removeItem('ironPhone');pid=null;token=null;view='join';render();}}
  if(m.type==='removed'){localStorage.removeItem('ironPhone');pid=null;token=null;room='';requestedJoin=false;publicS=null;privateS=null;ws.close();view='join';notify('You have been removed by the host.');}
 }catch(err){console.error(err);}};
 ws.onclose=()=>{$('connection').classList.remove('hidden');setTimeout(connect,1500);};ws.onerror=()=>{};
}
function joinNow(){room=$('joinCode').value.trim().toUpperCase();manualName=$('joinName').value.trim();if(!/^[A-Z]{4}$/.test(room)||!manualName){notify('Enter your four-letter room code and name.');return;}requestedJoin=true;if(ws?.readyState===1)ws.send(JSON.stringify({type:'join',code:room,name:manualName}));else connect();}
const h=(title,tagline='')=>`<div class="eyebrow">${esc(tagline)}</div><h1>${esc(title)}</h1>`;
function render(){const s=publicS,p=privateS;
 $('status').textContent=s?`${s.code} · ${s.era.toUpperCase()} · ${s.round?`ROUND ${s.round}/${s.totalRounds}`:'LOBBY'}`:'PRIVATE CONTROLLER';
 if(!s||!p){$('app').innerHTML=`<section class="phone-join-scene"><img src="/art/iron-crown-premium.png" alt="Iron Crown"><div class="eyebrow">PRIVATE RAILWAY CONTROLLER</div><p>BUILD THE LINES. CLAIM THE CROWN.</p></section><section class="card gold animated join-form">${h('Join the Empire','The Crown awaits')}<p class="caption">Scan the code on the TV or enter the room code to join the game.</p><label for="joinCode">Four-letter room code</label><input id="joinCode" value="${esc(room)}" maxlength="4" inputmode="text" autocapitalize="characters" autocomplete="off" placeholder="ABCD" style="text-align:center;font-size:27px;letter-spacing:.18em;text-transform:uppercase"><label for="joinName">Your name</label><input id="joinName" maxlength="22" placeholder="Your tycoon name" autocomplete="nickname" value="${esc(manualName)}"><button class="btn" id="joinBtn">Join the Empire →</button></section>`;$('joinBtn').onclick=joinNow;return;}
 if(!p.avatar){renderAvatar();return;}
 if(s.status==='lobby'){renderLobby();return;}
 if(s.status==='tickets'&&p.ticketChoices.length){renderTicketPick();return;}
 if(s.status==='placement'){renderPlacement();return;}
 if(s.status==='draft'&&!p.draftDone){renderDraft();return;}
 if(s.status==='plan'){telegraphMode=false;if(spectateTickets){renderTickets();return;}renderPlan();return;}
 if(s.status==='reveal'&&telegraphMode&&!p.telegraphUsed){renderTelegraph();return;}
 if(s.status==='offer'&&p.offer){renderOffer();return;}
 if(s.status==='finished'){renderResults();return;}
 renderWatch();

function isTicketComplete(ticket){const adj={};for(const r of publicS.routes.filter(r=>r.owner===pid))for(let i=1;i<r.path.length;i++){const a=r.path[i-1],b=r.path[i];(adj[a]??=[]).push(b);(adj[b]??=[]).push(a);}const visited=new Set([ticket.a]),q=[ticket.a];while(q.length){const v=q.shift();if(v===ticket.b)return true;for(const n of adj[v]||[])if(!visited.has(n)){visited.add(n);q.push(n);}}return false;}
function renderOffer(){const o=privateS.offer,from=publicS.players.find(p=>p.id===o.from);const fmt=v=>Object.entries(v).filter(([,n])=>n>0).map(([k,n])=>`${n} ${k}`).join(', ');
 $('app').innerHTML=`<section class="card gold animated"><div class="trade-character"><img src="${avatar(from?.avatar||'augusta')}" alt=""><div>${h('A trade proposal','Your decision is requested')}<h2>${esc(from?.name||'A tycoon')} proposes:</h2></div></div><div class="ticket"><p>You receive <b>${esc(fmt(o.give))}</b></p><p>You give <b>${esc(fmt(o.want))}</b></p></div><p>⏱ <b id="tradeClock">${remaining(o.deadline)}</b> to decide.</p>${o.compelled?'<div class="hint">This offer is compulsory under the Smuggler’s Advanced perk.</div>':''}<button id="accept" class="btn green">Accept trade</button><button id="decline" class="btn red" ${o.compelled?'disabled':''}>Decline</button></section>`;
 $('accept').onclick=()=>send('tradeReply',{accept:true});$('decline').onclick=()=>send('tradeReply',{accept:false});
}
function renderWatch(){const s=publicS;const recent=s.feed.filter(x=>x.player===pid||x.message.includes(current()?.name||'∅')).slice(-4).reverse();const clash=[...s.feed].reverse().find(x=>x.kind==='clash'&&x.results?.some(r=>r.id===pid));const mood=clash?(clash.player===pid?'smug':'furious'):'neutral';
 $('app').innerHTML=`${resources()}<section class="card gold" style="text-align:center"><div class="eyebrow">Round ${s.round} · ${s.status.toUpperCase()}</div><h1>${s.status==='income'?'The trains are running':s.status==='reveal'?'Watch the TV!':s.status==='draft'?'Era upgrade':'Orders in motion'}</h1><img class="big-avatar watch-avatar" src="${avatar(current().avatar,mood)}" alt="Your tycoon"><div class="watch-mood">${clash?(mood==='smug'?'★ YOUR COMPANY WON THE CLASH':'⚔ YOUR COMPANY LOST THE CLASH'):(people.find(a=>a[0]===current()?.avatar)?.[2]||'RAILWAY TYCOON')}</div><p>${s.status==='income'?'Your holdings are producing materials and railway revenue.':s.status==='reveal'?'Your secret orders are being revealed to the room. Watch the board for the action!':s.status==='draft'?'Waiting for other tycoons to choose their upgrades.':'Other tycoons are making their decisions.'}</p></section><section class="card"><h3>Your latest news</h3>${recent.length?recent.map(x=>`<p class="caption">• ${esc(x.message)}</p>`).join(''):'<p class="caption">Your next move awaits.</p>'}<button class="btn alt" id="showTickets">View my tickets</button>${s.status==='reveal'&&privateS.upgrades.includes('telegraph')&&!privateS.telegraphUsed?'<button class="btn" id="telegraphBtn">⚡ Intercept an order (Telegraph)</button>':''}</section>${hint('Income is automatic. Use the TV to enjoy the reveal, then plan two new orders next round.')}`;
 $('showTickets').onclick=()=>{spectateTickets=true;renderTickets();};if($('telegraphBtn'))$('telegraphBtn').onclick=()=>{telegraphMode=true;actionSlot=1;editType='';renderTelegraph();};
}
function renderResults(){const ranking=[...publicS.players].sort((a,b)=>publicS.finalRanking.indexOf(a.id)-publicS.finalRanking.indexOf(b.id)),place=ranking.findIndex(p=>p.id===pid)+1,me=current(),b=me.breakdown;
 $('app').innerHTML=`<section class="card gold" style="text-align:center"><div class="eyebrow">The crown has been awarded</div><h1>${place===1?'♛ You are the Iron Crown!':'The Railway Race Is Over'}</h1><img class="big-avatar" src="${avatar(me.avatar,place===1?'smug':'neutral')}" alt="Your tycoon"><h2>${place===1?'Champion':`You finished #${place}`}</h2><p><strong style="font-size:32px;color:var(--brass)">★ ${me.prestige} Prestige</strong></p></section><section class="card"><h2>Your Prestige breakdown</h2>${[['Market Towns',b.depot],['Cities',b.city],['Completed Tickets',b.tickets],['Longest Railway Trophy',b.rail],['Largest Army Trophy',b.army],['Grand Station',b.grand],['Royal Prestige',b.bonus],['Unfinished tickets penalty',-b.unfinished]].map(([name,val])=>`<div class="sheet-row"><span>${name}</span><b>${val||0}</b></div>`).join('')}</section><section class="card"><h2>Final rankings</h2>${ranking.map((p,i)=>`<div class="sheet-row"><span>${i+1}. ${esc(p.name)}</span><b>★ ${p.prestige}</b></div>`).join('')}<p class="caption">The host can begin a new game on the TV.</p></section>`;
}
const ruleCopy=[['1. Earn the crown','First to 15 Prestige (10 in Quick), or highest at the end, wins. Market Town depots, cities, tickets and trophies score points.'],['2. Place two Depots','Choose free production tiles in snake order. Each starting Depot gets one Soldier. Your phone keeps your tickets hidden.'],['3. Income and orders','Your holdings produce every round. Secretly choose two actions (Research at most once), then Lock In. Unused actions pass at the deadline.'],['4. Build and trade','New Depots cost Timber and Grain. Cities cost Grain, Steel and Coal. Whole routes cost Timber and Steel per segment. Trade with the bank or offer to another tycoon.'],['5. Clash for territory','Attack adjacent enemy tiles with Soldiers. Add a die (1–6), with Hills/City bonuses for the defender. Ties go to the defender. No player is ever eliminated.'],['6. Progress through eras','Steam, Iron, then Electric. Each era offers an Upgrade. Advanced mode adds events, character perks and unfinished-ticket penalties.']];
$('rules').onclick=()=>{$('rulesOverlay').innerHTML=`<section class="card gold"><div class="eyebrow">A pocket rulebook</div><h1>How to Play</h1>${ruleCopy.map(([t,v])=>`<div class="ticket"><h3>${t}</h3><p>${v}</p></div>`).join('')}<button class="btn" id="closeRules">Back to the game</button></section>`;$('rulesOverlay').classList.remove('hidden');$('closeRules').onclick=()=>$('rulesOverlay').classList.add('hidden');};
render();connect();
</script></body></html>
