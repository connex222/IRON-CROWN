 const palette={coal:['#686861','#414d4a'],forest:['#61865d','#2e5645'],farm:['#ebc96c','#a7904b'],steel:['#ae8265','#765b52'],town:['#ddb28a','#986f52'],hill:['#91a085','#526e58'],lake:['#74c1c5','#488d9e'],capital:['#deb966','#a38743']};

 for(const t of tiles){const {x,y}=pos(t),legal=isLegal(type,t),picked=selected===t.id,cl=palette[t.type],owner=publicS.players.find(p=>p.id===t.owner),c=owner?people.find(q=>q[0]===owner.avatar)?.[3]||'#30312c':null;
  bases+=`<polygon points="${poly(x,y+5)}" fill="${cl[1]}" stroke="#34423d" stroke-width="1.5"/>`;
  bases+=`<polygon data-tile="${t.id}" class="${legal?'legal':''} ${picked?'picked':''}" points="${poly(x,y)}" fill="${cl[0]}" stroke="${picked?'#fff':c||'#f4deb2'}" stroke-width="${picked?5:c?4:1.5}" opacity="${legal||picked?1:.9}"><title>${esc(tileName(t.id))}</title></polygon>`;
  if(legal)marks+=`<polygon points="${poly(x,y,23)}" fill="none" stroke="#fff4a4" stroke-width="2.5" stroke-dasharray="4 3" pointer-events="none"/>`;
  if(picked)marks+=`<circle cx="${x+17}" cy="${y-14}" r="9" fill="#244e38" stroke="#fff" stroke-width="2" pointer-events="none"/><text x="${x+17}" y="${y-10}" fill="white" text-anchor="middle" font-size="13" font-weight="bold" pointer-events="none">✓</text>`;
  marks+=`<text pointer-events="none" x="${x}" y="${y+7}" font-size="${t.type==='capital'?25:19}" font-weight="700" text-anchor="middle" fill="${t.type==='forest'?'#e0f0d9':'#263229'}">${symbols[t.type]}</text>`;
  if(t.owner)marks+=`<circle cx="${x+15}" cy="${y-15}" r="6" fill="${c}" stroke="#fff7ce" stroke-width="1.4" pointer-events="none"/>`;
 }
 if(type==='track')for(const r of publicS.routes){const d=r.path.map((id,i)=>{const p=pos(byId[id]);return`${i?'L':'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`;}).join(' '),legal=privateS?.legal?.track?.includes(r.id),picked=selected===r.id;
  railways+=`<g data-line="${r.id}"><path d="${d}" stroke="#1b2b26" stroke-width="${legal?14:7}" fill="none" opacity=".76" stroke-linecap="round" pointer-events="none"/><path d="${d}" stroke="${picked?'#fff':legal?'#ffe57a':'#a7a58b'}" stroke-width="${legal?7:3}" fill="none" stroke-linecap="round" stroke-dasharray="${legal?'':'3 8'}" pointer-events="none"/><path data-route="${r.id}" class="${legal?'legal':''} ${picked?'picked':''}" d="${d}" stroke="transparent" stroke-width="25" fill="none" pointer-events="${legal?'stroke':'none'}"><title>${esc(routeName(r.id))}</title></path></g>`;
 }
 return `<svg class="minimap" viewBox="0 0 355 331" role="img" aria-label="Select a highlighted ${type==='track'?'railway route':'country tile'}"><g class="mini-ground">${bases}</g><g>${marks}</g><g class="mini-routes">${railways}</g></svg><p class="map-hint">${type==='track'?'Tap a highlighted railway, or choose it from the list below.':'Gold dashed outlines mark eligible tiles. Tap one to choose it.'}</p>`;
}
function bindMini(type,onPick){$('app').querySelectorAll('.minimap [data-tile].legal').forEach(el=>el.onclick=()=>onPick(el.dataset.tile));$('app').querySelectorAll('.minimap [data-route].legal').forEach(el=>el.onclick=()=>onPick(el.dataset.route));}
function targetList(type,selected,onPick){const values=type==='track'?privateS.legal.track:privateS.legal[type]||[];const list=values.map(id=>type==='track'?{id,name:routeName(id)}:{id,name:tileName(id)});
 $('editorTargetList').innerHTML=`<div class="target-list">${list.length?list.map(x=>`<button type="button" class="target-button ${x.id===selected?'selected':''}" data-pick="${x.id}">${esc(x.name)} <span>${x.id===selected?'✔':'›'}</span></button>`).join(''):'<p class="caption">No legal targets currently available.</p>'}</div>`;
 $('editorTargetList').querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>onPick(el.dataset.pick));
}
function routeName(id){const r=publicS.routes.find(r=>r.id===id);return r?`${tileName(r.a)} – ${tileName(r.b)} (${r.segments} segments)`:'Unknown route';}
function renderEditor(){const e=editor,legal=privateS.legal||{},type=editType;if(!e)return;const out=$('editor');if(!out)return;
 const targetKinds=['build','city','track','recruit','attack'];
 if(targetKinds.includes(type)){
  const legalIds=legal[type]||[];
  if(!e.tile&&!e.route&&legalIds.length)e[type==='track'?'route':'tile']=legalIds[0];
  const key=type==='track'?'route':'tile';
  out.innerHTML=`<h3>${esc(actionNames[type])}</h3><p class="caption">${{build:'1 Timber + 1 Grain · Claim an adjacent tile.',city:'2 Grain + 2 Steel + 1 Coal · Turn an owned Market Town into a City.',track:'1 Timber + 1 Steel per track segment, subject to upgrades.',recruit:'2 Gold per soldier. Recruit one to three soldiers.',attack:'Commit Soldiers from your adjacent depots. Highest roll plus strength wins.'}[type]}</p>${miniMap(type,e[key])}<div id="editorTargetList"></div>${type==='recruit'?`<label>Soldiers to recruit</label><div class="stepper"><button id="less">−</button><output id="quantity">${e.count||1}</output><button id="more">+</button></div>`:''}${type==='attack'?`<div id="troops"></div>`:''}<button id="saveAction" class="btn" ${legalIds.length?'':'disabled'}>Assign to slot ${actionSlot+1} →</button>`;
  const select=id=>{e[key]=id;renderEditor();};bindMini(type,select);targetList(type,e[key],select);
  if(type==='recruit'){$('less').onclick=()=>{e.count=Math.max(1,(e.count||1)-1);$('quantity').textContent=e.count;};$('more').onclick=()=>{e.count=Math.min(3,(e.count||1)+1);$('quantity').textContent=e.count;};}
  if(type==='attack')renderTroops();
  $('saveAction').onclick=()=>{let a={type};a[key]=e[key];if(type==='recruit')a.count=e.count||1;if(type==='attack'){
   a.sources=[...$('troops').querySelectorAll('[data-source]')].map(n=>({tile:n.dataset.source,count:Number(n.value)})).filter(n=>n.count>0);if(!a.sources.length){notify('Commit at least one soldier.');return;}
  }saveOrder(a);};return;
 }
 if(type==='research'){
  const options=[{id:'ticket',name:'Draw a Destination Ticket',detail:'Receive one more secret destination.'},...['steam','iron','electric'].flatMap((era,i)=>era===publicS.era?({steam:[['navvies','Navvy Gangs'],['corn','Corn Exchange'],['militia','Militia']],iron:[['bessemer','Bessemer Process'],['express','Express Lines'],['fort','Fortifications']],electric:[['telegraph','Telegraph'],['station','Grand Station'],['directors','Board of Directors']]}[era]||[]).filter(([id])=>!privateS.upgrades.includes(id)).map(([id,name])=>({id,name,detail:'Buy this era Upgrade.'})):[])];
  out.innerHTML=`<h3>Research</h3><p class="caption">3 Gold + 1 Coal (subject to bonuses). Research can be planned once per round.</p>${options.map(x=>`<button class="draft-card" data-research="${x.id}"><b>${esc(x.name)}</b><br><small>${esc(x.detail)}</small></button>`).join('')}`;
  out.querySelectorAll('[data-research]').forEach(b=>b.onclick=()=>{saveOrder({type:'research',kind:b.dataset.research==='ticket'?'ticket':'upgrade',upgrade:b.dataset.research==='ticket'?undefined:b.dataset.research});});return;
 }
 if(type==='trade'){const options=Object.keys(resourceIcons);
  out.innerHTML=`<h3>Trade</h3><p class="caption">Exchange with the bank, or ask another tycoon. Player trades are offered during Reveal with a 20-second reply timer.</p><div class="row"><button id="bankTab" class="btn alt tiny ${e.kind==='bank'?'selected':''}">Bank Trade</button><button id="playerTab" class="btn alt tiny">Player Offer</button></div><div id="tradeBody"></div>`;
  $('bankTab').onclick=()=>{e.kind='bank';renderEditor();};$('playerTab').onclick=()=>{e.kind='player';renderEditor();};
  if(e.kind==='bank'){$('tradeBody').innerHTML=`<label>Give resource</label><select id="giveResource">${options.map(x=>`<option value="${x}" ${x===e.give?'selected':''}>${x}</option>`).join('')}</select><label>Receive resource</label><select id="wantResource">${options.map(x=>`<option value="${x}" ${x===e.want?'selected':''}>${x}</option>`).join('')}</select><div class="hint">Normally 3:1. Certain events and upgrades adjust this exchange rate.</div><button id="saveTrade" class="btn">Assign bank exchange →</button>`;
   $('saveTrade').onclick=()=>{e.give=$('giveResource').value;e.want=$('wantResource').value;saveOrder({type:'trade',kind:'bank',give:e.give,want:e.want});};
  }else{
   const others=publicS.players.filter(x=>x.id!==pid);
   $('tradeBody').innerHTML=`<label>Choose trading partner</label><select id="partner">${others.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><div class="offer-grid"><div><h3>I give</h3><div id="giveRows"></div></div><div><h3>I want</h3><div id="wantRows"></div></div></div><button id="saveTrade" class="btn">Assign player offer →</button>`;
   for(const side of ['give','want']){const target=$(`${side}Rows`),vals=e[side==='give'?'tradeGive':'tradeWant'];target.innerHTML=options.map(k=>`<label>${k}</label><div class="stepper"><button data-dec="${side}:${k}">−</button><output data-num="${side}:${k}">${vals[k]||0}</output><button data-inc="${side}:${k}">+</button></div>`).join('');}
   out.querySelectorAll('[data-inc], [data-dec]').forEach(b=>b.onclick=()=>{const [side,k]=(b.dataset.inc||b.dataset.dec).split(':');const obj=e[side==='give'?'tradeGive':'tradeWant'];obj[k]=Math.max(0,Math.min(9,(obj[k]||0)+(b.dataset.inc?1:-1)));out.querySelector(`[data-num="${side}:${k}"]`).textContent=obj[k];});
   $('saveTrade').onclick=()=>{saveOrder({type:'trade',kind:'player',to:$('partner').value,give:e.tradeGive,want:e.tradeWant});};
  }return;
 }
}
function renderTroops(){const target=publicS.tiles.find(t=>t.id===editor.tile);if(!target)return;const neigh=publicS.tiles.filter(t=>t.owner===pid&&t.soldiers>0&&Math.max(Math.abs(t.q-target.q),Math.abs(t.r-target.r),Math.abs(t.q+t.r-target.q-target.r))===1);
 $('troops').innerHTML=`<h3 style="margin:15px 0 5px">Commit your troops</h3>${neigh.map(t=>`<label>${esc(tileName(t.id))} (${t.soldiers} available)</label><select data-source="${t.id}">${Array.from({length:t.soldiers+1},(_,i)=>`<option value="${i}">${i} soldier${i===1?'':'s'}</option>`).join('')}</select>`).join('')}`;
}
function renderTickets(){$('app').innerHTML=`<section class="card gold">${h('Your secret destinations','Classified contracts')}<p class="caption">Connect the marked towns with railways you own to earn the printed Prestige.</p><button class="btn alt" id="backPlan">← Return to planning</button></section><section class="card">${privateS.tickets.map(t=>ticketHTML({...t,complete:isTicketComplete(t)})).join('')}</section>`;$('backPlan').onclick=()=>{spectateTickets=false;render();};}
function isTicketComplete(ticket){const adj={};for(const r of publicS.routes.filter(r=>r.owner===pid))for(let i=1;i<r.path.length;i++){const a=r.path[i-1],b=r.path[i];(adj[a]??=[]).push(b);(adj[b]??=[]).push(a);}const visited=new Set([ticket.a]),q=[ticket.a];while(q.length){const v=q.shift();if(v===ticket.b)return true;for(const n of adj[v]||[])if(!visited.has(n)){visited.add(n);q.push(n);}}return false;}
function renderOffer(){const o=privateS.offer,from=publicS.players.find(p=>p.id===o.from);const fmt=v=>Object.entries(v).filter(([,n])=>n>0).map(([k,n])=>`${n} ${k}`).join(', ');
 $('app').innerHTML=`<section class="card gold animated"><div class="trade-character"><img src="${avatar(from?.avatar||'augusta')}" alt=""><div>${h('A trade proposal','Your decision is requested')}<h2>${esc(from?.name||'A tycoon')} proposes:</h2></div></div><div class="ticket"><p>You receive <b>${esc(fmt(o.give))}</b></p><p>You give <b>${esc(fmt(o.want))}</b></p></div><p>⏱ <b id="tradeClock">${remaining(o.deadline)}</b> to decide.</p>${o.compelled?'<div class="hint">This offer is compulsory under the Smuggler’s Advanced perk.</div>':''}<button id="accept" class="btn green">Accept trade</button><button id="decline" class="btn red" ${o.compelled?'disabled':''}>Decline</button></section>`;
 $('accept').onclick=()=>send('tradeReply',{accept:true});$('decline').onclick=()=>send('tradeReply',{accept:false});
}
function renderWatch(){const s=publicS;const recent=s.feed.filter(x=>x.player===pid||x.message.includes(current()?.name||'∅')).slice(-4).reverse();const clash=[...s.feed].reverse().find(x=>x.kind==='clash'&&x.results?.some(r=>r.id===pid));const mood=moodFor(current()?.avatar);
 $('app').innerHTML=`${resources()}<section class="card gold" style="text-align:center"><div class="eyebrow">Round ${s.round} · ${s.status.toUpperCase()}</div><h1>${s.status==='income'?'The trains are running':s.status==='reveal'?'Watch the TV!':s.status==='draft'?'Era upgrade':'Orders in motion'}</h1><img class="big-avatar watch-avatar" data-live-portrait="${current().avatar}" src="${avatar(current().avatar)}" alt="Your tycoon"><div class="watch-mood" id="liveReaction" aria-live="polite">${esc(reactionLabel(current()))}</div><p>${s.status==='income'?'Your holdings are producing materials and railway revenue.':s.status==='reveal'?'Your secret orders are being revealed to the room. Watch the board for the action!':s.status==='draft'?'Waiting for other tycoons to choose their upgrades.':'Other tycoons are making their decisions.'}</p></section><section class="card"><h3>Your latest news</h3>${recent.length?recent.map(x=>`<p class="caption">• ${esc(x.message)}</p>`).join(''):'<p class="caption">Your next move awaits.</p>'}<button class="btn alt" id="showTickets">View my tickets</button>${s.status==='reveal'&&privateS.upgrades.includes('telegraph')&&!privateS.telegraphUsed?'<button class="btn" id="telegraphBtn">⚡ Intercept an order (Telegraph)</button>':''}</section>${hint('Income is automatic. Use the TV to enjoy the reveal, then plan two new orders next round.')}`;
 $('showTickets').onclick=()=>{spectateTickets=true;renderTickets();};if($('telegraphBtn'))$('telegraphBtn').onclick=()=>{telegraphMode=true;actionSlot=1;editType='';renderTelegraph();};
}
function renderResults(){const ranking=[...publicS.players].sort((a,b)=>publicS.finalRanking.indexOf(a.id)-publicS.finalRanking.indexOf(b.id)),place=ranking.findIndex(p=>p.id===pid)+1,me=current(),b=me.breakdown;
 $('app').innerHTML=`<section class="card gold" style="text-align:center"><div class="eyebrow">The crown has been awarded</div><h1>${place===1?'♛ You are the Iron Crown!':'The Railway Race Is Over'}</h1><img class="big-avatar" src="${avatar(me.avatar,place===1?'smug':'neutral')}" alt="Your tycoon"><h2>${place===1?'Champion':`You finished #${place}`}</h2><p><strong style="font-size:32px;color:var(--brass)">★ ${me.prestige} Prestige</strong></p></section><section class="card"><h2>Your Prestige breakdown</h2>${[['Market Towns',b.depot],['Cities',b.city],['Completed Tickets',b.tickets],['Longest Railway Trophy',b.rail],['Largest Army Trophy',b.army],['Grand Station',b.grand],['Royal Prestige',b.bonus],['Unfinished tickets penalty',-b.unfinished]].map(([name,val])=>`<div class="sheet-row"><span>${name}</span><b>${val||0}</b></div>`).join('')}</section><section class="card"><h2>Final rankings</h2>${ranking.map((p,i)=>`<div class="sheet-row"><span>${i+1}. ${esc(p.name)}</span><b>★ ${p.prestige}</b></div>`).join('')}<p class="caption">The host can begin a new game on the TV.</p></section>`;
}
const ruleCopy=[['1. Earn the crown','First to 15 Prestige (10 in Quick), or highest at the end, wins. Market Town depots, cities, tickets and trophies score points.'],['2. Place two Depots','Choose free production tiles in snake order. Each starting Depot gets one Soldier. Your phone keeps your tickets hidden.'],['3. Income and orders','Your holdings produce every round. Secretly choose two actions (Research at most once), then Lock In. Unused actions pass at the deadline.'],['4. Build and trade','New Depots cost Timber and Grain. Cities cost Grain, Steel and Coal. Whole routes cost Timber and Steel per segment. Trade with the bank or offer to another tycoon.'],['5. Clash for territory','Attack adjacent enemy tiles with Soldiers. Add a die (1–6), with Hills/City bonuses for the defender. Ties go to the defender. No player is ever eliminated.'],['6. Progress through eras','Steam, Iron, then Electric. Each era offers an Upgrade. Advanced mode adds events, character perks and unfinished-ticket penalties.']];
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('rulesOverlay').classList.contains('hidden'))$('rulesOverlay').classList.add('hidden');});
$('rules').onclick=()=>{$('rulesOverlay').innerHTML=`<section class="card gold"><div class="eyebrow">A pocket rulebook</div><h1>How to Play</h1>${ruleCopy.map(([t,v])=>`<div class="ticket"><h3>${t}</h3><p>${v}</p></div>`).join('')}<button class="btn" id="closeRules">Back to the game</button></section>`;$('rulesOverlay').classList.remove('hidden');$('closeRules').onclick=()=>$('rulesOverlay').classList.add('hidden');};
render();connect();
</script></body></html>
